name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Download JetBrains Mono font
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/jetbrains_mono.ttf \
            https://raw.githubusercontent.com/JetBrains/JetBrainsMono/master/fonts/ttf/JetBrainsMono-Regular.ttf

      # Keep the same signing key between builds so the APK can be installed over the previous one
      - name: Restore signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shin-debug-keystore-v1

      - name: Create signing key (first build only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShinLauncher-i3
          path: app/build/outputs/apk/debug/*.apk
